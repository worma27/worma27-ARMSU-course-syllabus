<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจัดทำ มคอ.3 (AUN-QA)</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1c1c1a;--mu:#6b6b66;--bd:#d9d7d0;--ac:#1d5c4a;--ac2:#e3efe9;--wn:#fff4e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222221;--tx:#ecebe6;--mu:#a09f98;--bd:#3a3a37;--ac:#6fc1a5;--ac2:#25352f;--wn:#3a3222}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Mitr','Noto Sans Thai',sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header h1{font-size:18px;margin:0 auto 0 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
main{max-width:1100px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px;color:var(--ac)}
label{display:block;font-size:14px;color:var(--mu);margin-bottom:10px}

.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}

td textarea,td input{margin:0;min-height:0}td textarea{min-height:52px}

#plan{table-layout:fixed;min-width:900px}.hint{font-size:13px;color:var(--mu)}.tot{text-align:right;font-weight:600;margin-top:8px}

</style></head><body>
<header><h1>ระบบจัดทำ มคอ.3 (AUN-QA)</h1>
<button class="s" id="bB" title="เลือกข้อความในตารางแล้วกด หรือใช้ Ctrl+B"><b>B</b> ตัวหนา</button><button class="s" id="bReset">ล้างข้อมูล</button><button class="s" id="bPdf">ส่งออก PDF</button><button id="bWord">ส่งออก Word</button></header>
<main id="app"></main><div id="pv"></div>
<script>
const TD=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'],TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const kd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const yy=d=>String((d.getFullYear()+543)%100).padStart(2,'0');
const fd=d=>TD[d.getDay()]+' '+d.getDate()+' '+TM[d.getMonth()]+' '+yy(d);
const fr=(a,b)=>a.getDate()+(a.getMonth()==b.getMonth()?'':' '+TM[a.getMonth()])+' - '+b.getDate()+' '+TM[b.getMonth()]+' '+yy(b);
const GR='A|ดีเยี่ยม|80 ขึ้นไป\nB+|ดีมาก|75-79.99\nB|ดี|70-74.99\nC+|ค่อนข้างดี|65-69.99\nC|พอใช้|60-64.99\nD+|อ่อน|55-59.99\nD|อ่อนมาก|50-54.99\nF|ไม่ผ่าน|0-49.99';
const DEF=()=>({f:{phil:'“การจัดการศึกษาแบบบูรณาการศาสตร์ เพื่อการเรียนรู้ตลอดชีวิต การสร้างสรรค์นวัตกรรมและการส่งเสริมภูมิปัญญาท้องถิ่นสู่สากล”',prereq:'ไม่มี',coreq:'ไม่มี',grade:GR},
cr:{t:6,l:0,p:12,s:6,w:15},clo:[{c:'',m:'',a:''}],plo:[{p:'',d:'',c:''}],ass:[{c:'',m:'',w:'',r:''}],
ses:[{d:1,t1:'13:00',t2:'16:00',room:'',h:''},{d:4,t1:'09:00',t2:'16:00',room:'',h:''}],
start:'',mid1:'',mid2:'',fin1:'',fin2:'',hc:[],hx:[],rows:{},col:{ht:'#000000',hf:'#fff2cc',et:'#000000',ef:'#ddebf7'},cw:[7,13,43,7,15,15]});
let S=DEF();
try{const x=localStorage.getItem('tqf3');if(x){const o=JSON.parse(x);S=Object.assign(DEF(),o);S.f=Object.assign(DEF().f,o.f)}}catch(e){}
const save=()=>{try{localStorage.setItem('tqf3',JSON.stringify(S))}catch(e){}};

/* วันหยุดราชการ */
const FX=[[1,1,'วันขึ้นปีใหม่'],[4,6,'วันจักรี'],[4,13,'วันสงกรานต์'],[4,14,'วันสงกรานต์'],[4,15,'วันสงกรานต์'],[5,1,'วันแรงงานแห่งชาติ'],[5,4,'วันฉัตรมงคล'],[6,3,'วันเฉลิมพระชนมพรรษาสมเด็จพระราชินี'],[7,28,'วันเฉลิมพระชนมพรรษา ร.10'],[8,12,'วันแม่แห่งชาติ'],[10,13,'วันคล้ายวันสวรรคต ร.9'],[10,23,'วันปิยมหาราช'],[12,5,'วันพ่อแห่งชาติ'],[12,31,'วันสิ้นปี'],[12,10,'วันรัฐธรรมนูญ']];
const LU={2026:[['03-03','วันมาฆบูชา'],['05-31','วันวิสาขบูชา'],['07-29','วันอาสาฬหบูชา'],['07-30','วันเข้าพรรษา']],2027:[['02-21','วันมาฆบูชา'],['05-20','วันวิสาขบูชา'],['07-18','วันอาสาฬหบูชา'],['07-19','วันเข้าพรรษา']]};
function holY(y,m){const L=FX.map(a=>[new Date(y,a[0]-1,a[1]),a[2]]).concat((LU[y]||[]).map(a=>[pd(y+'-'+a[0]),a[1]])).sort((a,b)=>a[0]-b[0]);
 for(const[d0,n0]of L){let d=new Date(d0),n=n0;if(d.getDay()==0||d.getDay()==6){n='หยุดชดเชย'+n;d.setDate(d.getDate()+(d.getDay()==6?2:1));while(m[kd(d)])d.setDate(d.getDate()+1)}m[kd(d)]=n}}
function allHol(){const m={};if(!S.start)return m;const a=pd(S.start).getFullYear(),b=(S.fin2?pd(S.fin2):pd(S.start)).getFullYear();
 for(let y=a;y<=b+1;y++)holY(y,m);S.hx.forEach(x=>delete m[x]);S.hc.forEach(h=>m[h.d]=h.n);return m}

/* ชั่วโมงและตารางสอน */
const perWeek=()=>(+S.cr.l||0)+(+S.cr.p||0);
const sh=s=>s.h!==''&&s.h!=null?+s.h:Math.round(perWeek()/(S.ses.length||1)*10)/10;
function list(){const o=[];if(!S.start||!S.fin1)return o;const st=pd(S.start),en=pd(S.fin1),m1=S.mid1&&pd(S.mid1),m2=S.mid2&&pd(S.mid2),H=allHol();
 let md=0,lw='',wk=0;
 for(let d=new Date(st);d<en;d.setDate(d.getDate()+1)){
  if(m1&&!md&&d>=m1){md=1;o.push({t:'mid'})}
  if(m1&&m2&&d>=m1&&d<=m2)continue;
  S.ses.forEach((s,i)=>{if(+s.d!==d.getDay())return;const mo=new Date(d);mo.setDate(d.getDate()-((d.getDay()+6)%7));const wkk=kd(mo);let w='';if(wkk!==lw){lw=wkk;w=++wk}
   o.push({t:H[kd(d)]?'hol':'cls',d:new Date(d),k:kd(d)+'#'+i,w,s,n:H[kd(d)]})})}
 o.push({t:'fin'});return o}
const rng=(a,b)=>a&&b?fr(pd(a),pd(b)):'';
const rd=k=>S.rows[k]||(S.rows[k]={});
const tm=x=>{const[a,b]=x.split(':').map(Number);return a+b/60};
const spl=s=>s.sp===''||s.sp==null?(s.t1<'12:00'&&s.t2>'13:00'):!!s.sp;
const spr=r=>{const o=S.rows[r.k]&&S.rows[r.k].sp;return typeof o=='boolean'?o:spl(r.s)};
function parts(r){return spr(r)?[{k:r.k+'m',lab:'เช้า'},{k:r.k+'a',lab:'บ่าย'}]:[{k:r.k,lab:''}]}
const cg=()=>{const sm=S.cw.reduce((a,b)=>a+b,0)||1;return'<colgroup>'+S.cw.map(v=>`<col style="width:${(v/sm*91).toFixed(2)}%">`).join('')+'<col style="width:9%"></colgroup>'};
const cwd=()=>{const sm=S.cw.reduce((a,b)=>a+b,0)||1,w=S.cw.map(v=>Math.round(v/sm*9638));w[2]+=9638-w.reduce((a,b)=>a+b,0);return w};
const sty=(a,b)=>`background:${S.col[a]};color:${S.col[b]};text-align:center;font-weight:700;`;
const hv=r=>{const v=S.rows[r.k];return v&&v.h!=null&&v.h!==''?+v.h:sh(r.s)};
function flat(){const o=[];let g=null;
 list().forEach(r=>{if(r.t=='mid'||r.t=='fin'){g=null;o.push({t:r.t});return}
  let ng=false;if(r.w||!g){g={n:r.w,c:0};ng=true}
  const ps=r.t=='hol'?[null]:parts(r);
  ps.forEach((p,j)=>{o.push({t:r.t,r,p,j,np:ps.length,ws:ng&&j==0?g:null});g.c++})});return o}

/* ส่วนติดต่อผู้ใช้ */
const F=(k,l,t)=>`<label>${l}${t?`<textarea data-k="${k}"></textarea>`:`<input data-k="${k}">`}</label>`;
const TE=(n,cols,labs)=>`<div class="sc"><table><tr>${labs.map(l=>`<th>${l}</th>`).join('')}<th></th></tr>${S[n].map((r,i)=>`<tr>${cols.map(c=>`<td><textarea data-t="${n}" data-i="${i}" data-f="${c}">${esc(r[c])}</textarea></td>`).join('')}<td><button class="x" data-a="del" data-n="${n}" data-i="${i}">ลบ</button></td></tr>`).join('')}</table></div><p><button class="s" data-a="add" data-n="${n}">+ เพิ่มแถว</button></p>`;
function ui(){const c=S.cr;
 document.getElementById('app').innerHTML=`
<section><h2>ตั้งค่าตารางสอน และจำนวนชั่วโมง</h2>
<div class="g"><label>หน่วยกิตรวม<input type="number" data-c="t" data-g value="${c.t}"></label><label>บรรยาย (ชม./สัปดาห์)<input type="number" data-c="l" data-g value="${c.l}"></label><label>ปฏิบัติ (ชม./สัปดาห์)<input type="number" data-c="p" data-g value="${c.p}"></label><label>ศึกษาด้วยตนเอง (ชม./สัปดาห์)<input type="number" data-c="s" data-g value="${c.s}"></label><label>จำนวนสัปดาห์ต่อภาค<input type="number" data-c="w" data-g value="${c.w}"></label></div>
<p id="hrs" class="hint"></p>
<div class="g"><label>วันเริ่มเรียนสัปดาห์แรก<input type="date" data-d="start" data-g value="${S.start}"></label><label>สอบกลางภาค เริ่ม<input type="date" data-d="mid1" data-g value="${S.mid1}"></label><label>สอบกลางภาค สิ้นสุด<input type="date" data-d="mid2" data-g value="${S.mid2}"></label><label>สอบปลายภาค เริ่ม<input type="date" data-d="fin1" data-g value="${S.fin1}"></label><label>สอบปลายภาค สิ้นสุด<input type="date" data-d="fin2" data-g value="${S.fin2}"></label></div>
<p><b>สีแถววันหยุดและแถวสอบ</b> <span class="hint">ใช้ทั้งในหน้านี้ ไฟล์ Word และ PDF</span></p>
<div class="g">${[['ht','วันหยุด สีตัวอักษร'],['hf','วันหยุด สีช่องตาราง'],['et','สอบ สีตัวอักษร'],['ef','สอบ สีช่องตาราง']].map(a=>`<label>${a[1]}<input type="color" data-col="${a[0]}" data-g value="${S.col[a[0]]}" style="height:38px;padding:2px"></label>`).join('')}</div>
<p><b>วันและเวลาเรียน</b> <span class="hint">เพิ่มได้หลายครั้งต่อสัปดาห์ ชั่วโมงเว้นว่างไว้ ระบบหารจากหน่วยกิตบรรยายและปฏิบัติให้</span></p>
<div class="sc"><table><tr><th>วัน</th><th>เริ่ม</th><th>สิ้นสุด</th><th>ห้อง</th><th>ชั่วโมงต่อครั้ง</th><th>แยกเช้า/บ่าย (ค่าเริ่มต้น)</th><th></th></tr>${S.ses.map((s,i)=>`<tr><td><select data-t="ses" data-i="${i}" data-f="d" data-g>${TD.map((n,j)=>`<option value="${j}"${+s.d==j?' selected':''}>${n}</option>`).join('')}</select></td><td><input type="time" data-t="ses" data-i="${i}" data-f="t1" data-g value="${s.t1}"></td><td><input type="time" data-t="ses" data-i="${i}" data-f="t2" data-g value="${s.t2}"></td><td><input data-t="ses" data-i="${i}" data-f="room" value="${esc(s.room)}"></td><td><input type="number" step="0.5" data-t="ses" data-i="${i}" data-f="h" data-g placeholder="${Math.round(perWeek()/(S.ses.length||1)*10)/10}" value="${esc(s.h)}"></td><td><input type="checkbox" data-t="ses" data-i="${i}" data-f="sp" data-g${spl(s)?' checked':''}></td><td><button class="x" data-a="del" data-n="ses" data-i="${i}">ลบ</button></td></tr>`).join('')}</table></div>
<p><button class="s" data-a="add" data-n="ses">+ เพิ่มวันเรียน</button></p>
<p><b>วันหยุดเพิ่มเติม / งดสอน</b> <span class="hint">วันหยุดราชการและวันชดเชยใส่ให้อัตโนมัติ (ข้อมูลวันพระ 2569-2570) ตรวจกับประกาศทางการอีกครั้ง</span></p>
<div class="g"><label>วันที่<input type="date" id="hd"></label><label>ชื่อวันหยุด<input id="hn"></label></div><p><button class="s" data-a="addh">+ เพิ่มวันหยุด</button></p><div id="hl"></div></section>
<section><h2>หมวดที่ 5 แผนการสอนและการประเมินผล</h2><h2 style="font-size:15px">5.1 แผนการสอน</h2><p class="hint">ทำตัวหนาบางข้อความ: เลือกข้อความในช่อง แล้วกดปุ่ม B ด้านบนหรือ Ctrl+B ข้อความจะมีเครื่องหมาย ** ครอบ และเป็นตัวหนาในไฟล์ Word และ PDF กดซ้ำเพื่อยกเลิก</p><p class="hint">ปรับความกว้างคอลัมน์ (ใช้กับไฟล์ Word ด้วย)</p><div class="g">${['สัปดาห์','วันที่สอน','หัวข้อ/รายละเอียด','ชั่วโมง','กิจกรรม/สื่อ','ผู้สอน'].map((n,i)=>`<label>${n} <b>${S.cw[i]}</b><input type="range" min="4" max="60" data-w="${i}" data-g value="${S.cw[i]}" style="padding:0"></label>`).join('')}</div><div class="sc"><table id="plan"></table></div>
</section>`;
 document.querySelectorAll('[data-k]').forEach(e=>e.value=S.f[e.dataset.k]||'');
 plan();hl();calc()}
function calc(){const c=S.cr,w=+c.w||0,e=document.getElementById('hrs');if(e)e.textContent=`หน่วยกิต ${c.t}(${c.l}-${c.p}-${c.s})  บรรยาย ${c.l*w} ชม./ภาค  ปฏิบัติ ${c.p*w} ชม./ภาค  ศึกษาด้วยตนเอง ${c.s*w} ชม./ภาค  ชั่วโมงสอนต่อสัปดาห์ ${perWeek()}`;
 const p=document.getElementById('pct');if(p){const n=S.ass.reduce((a,r)=>a+(parseFloat(r.r)||0),0);p.textContent='รวม '+n+'%'}}
function hl(){const e=document.getElementById('hl');if(!e)return;e.innerHTML=S.hc.map((h,i)=>`<span class="chip">${fd(pd(h.d))} ${esc(h.n)} <a href="#" data-a="rmh" data-i="${i}">ลบ</a></span>`).join('')+S.hx.map((h,i)=>`<span class="chip">ยกเลิกหยุด ${fd(pd(h))} <a href="#" data-a="rsh" data-i="${i}">คืนวันหยุด</a></span>`).join('')}
function plan(){const t=document.getElementById('plan');if(!t)return;const L=flat();
 if(!L.length){t.innerHTML='<tr><td>กรอกวันเริ่มเรียนและวันเริ่มสอบปลายภาค ตารางจะสร้างให้อัตโนมัติ</td></tr>';return}
 t.innerHTML=cg()+'<tr><th>สัปดาห์</th><th>วันที่สอน</th><th>หัวข้อ/รายละเอียด</th><th>ชม.</th><th>กิจกรรม/สื่อ</th><th>ผู้สอน</th><th></th></tr>'+L.map(x=>{
  if(x.t=='mid')return`<tr class="ex"><td colspan="7" style="${sty('ef','et')}">สอบกลางภาค วันที่ ${rng(S.mid1,S.mid2)}</td></tr>`;
  if(x.t=='fin')return`<tr class="ex"><td colspan="7" style="${sty('ef','et')}">สอบปลายภาค วันที่ ${rng(S.fin1,S.fin2)}</td></tr>`;
  const r=x.r,wk=x.ws?`<td rowspan="${x.ws.c}">${x.ws.n}</td>`:'';
  const dt=x.j==0?`<td rowspan="${x.np}">${fd(r.d)}<br><span class="hint">${r.s.t1}-${r.s.t2}</span></td>`:'';
